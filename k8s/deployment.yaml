apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifequest
  labels:
    app: lifequest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lifequest
  template:
    metadata:
      labels:
        app: lifequest
    spec:
      containers:
        - name: lifequest
          image: ghcr.io/skit-devops-2026/devops-24eskcs098:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lifequest-secrets
                  key: database-url
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lifequest-secrets
                  key: jwt-secret
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
